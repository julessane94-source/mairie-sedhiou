name: Tests Laravel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mairi_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
        coverage: xdebug

    - name: Copy .env.testing
      run: cp .env.example .env.testing

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate application key
      run: php artisan key:generate --env=testing

    - name: Wait for MySQL to be ready
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -uroot -proot 2>/dev/null; then
            echo "MySQL is up"
            exit 0
          fi
          echo "Waiting for MySQL..."
          sleep 1
        done
        exit 1

    - name: Run migrations
      run: php artisan migrate --env=testing
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: mairi_test
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Run feature tests
      run: php artisan test --env=testing --parallel
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: mairi_test
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Run pest tests (if using Pest)
      run: php artisan pest --env=testing --parallel 2>/dev/null || true
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: mairi_test
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Code style check (PSR-12)
      run: ./vendor/bin/pint --test 2>/dev/null || true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Run Laravel Pint
      run: ./vendor/bin/pint --test 2>/dev/null || true

    - name: Check for unused code with PHP-CS-Fixer
      run: ./vendor/bin/php-cs-fixer fix --dry-run --diff 2>/dev/null || true
